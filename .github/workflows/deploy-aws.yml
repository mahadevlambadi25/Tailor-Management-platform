name: Production AWS CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

# Deployment Safety: Prevent concurrent/overlapping deployments to avoid race conditions in migrations & ECS rolling updates
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  PROJECT_NAME: tailor-management
  ENVIRONMENT: production
  ECR_REPOSITORY: tailor-management-backend
  ECS_CLUSTER: tailor-management-production-cluster
  ECS_SERVICE: tailor-management-production-service
  ECS_WEB_TASK_DEF: tailor-management-production-web
  ECS_MIGRATION_TASK_DEF: tailor-management-production-db-migration

permissions:
  id-token: write # Required for AWS OIDC STS token exchange
  contents: read  # Required for actions/checkout

jobs:
  # ============================================================================
  # 1. Quality Gates, Unit & Integration Tests, and Compilations
  # ============================================================================
  quality-and-build:
    name: Code Quality & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client & Compile TypeScript
        working-directory: backend
        run: npm run build

      - name: Run Backend Test Suite
        working-directory: backend
        run: |
          echo "Running Migration Catalog Pre-Flight Guard Tests..."
          npx ts-node tests/test_deploy_migrations_guard.ts

          echo "Running Health & Readiness Probe Tests..."
          npx ts-node tests/test_health_and_readiness.ts

          echo "Running Standalone EventBridge Scheduler & Draining Tests..."
          npx ts-node tests/test_eventbridge_scheduler_standalone.ts

          echo "Running Outbox & Webhook Integration Tests..."
          npx ts-node tests/test_phase_b2_outbox_integration.ts

          echo "Running Nudge Concurrency Protection Tests..."
          npx ts-node tests/test_nudge_scheduler_concurrency.ts

          echo "Running Multi-Tenant IDOR Security Tests..."
          npx ts-node tests/test_idor_security_hardening.ts

      - name: Setup Frontend Dependencies & Test Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ============================================================================
  # 2. Backend Docker Build, Private VPC Migration & ECS Deployment
  # ============================================================================
  deploy-backend:
    name: Build Backend, Run VPC Migrations & Deploy ECS
    needs: quality-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Least-Privilege OIDC Authentication (No permanent AWS access keys in secrets)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Docker Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: backend
        run: |
          echo "Building production Docker image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          echo "Pushing images to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Private Database Migrations: Run one-off ECS Fargate task inside VPC
      # Never connects directly from public GitHub Actions runner to private RDS
      - name: Run Database Migrations in Private VPC
        id: run-migrations
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          echo "Discovering VPC networking configuration..."
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${PROJECT_NAME}-${ENVIRONMENT}-vpc" \
            --query "Vpcs[0].VpcId" --output text)

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" == "None" ]; then
            echo "::error::Target VPC '${PROJECT_NAME}-${ENVIRONMENT}-vpc' not found!"
            exit 1
          fi

          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Type,Values=PrivateApp" \
            --query "Subnets[*].SubnetId" --output text | tr '\t' ',')

          SEC_GROUP=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=${PROJECT_NAME}-${ENVIRONMENT}-ecs-tasks-sg" \
            --query "SecurityGroups[0].GroupId" --output text)

          echo "VPC: $VPC_ID"
          echo "Private Subnets: $SUBNETS"
          echo "Task Security Group: $SEC_GROUP"

          echo "Launching one-off ECS migration task using image: $IMAGE_URI ..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${ECS_MIGRATION_TASK_DEF}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUP],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"migration-runner\",\"image\":\"$IMAGE_URI\"}]}" \
            --query "tasks[0].taskArn" --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" == "None" ]; then
            echo "::error::Failed to launch ECS migration task!"
            exit 1
          fi

          echo "Migration Task launched: $TASK_ARN"
          echo "Waiting for migration task completion..."
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" --output text)

          STOP_REASON=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].stoppedReason" --output text)

          echo "Migration task finished with container exit code: $EXIT_CODE (Stop Reason: $STOP_REASON)"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Database migration task FAILED with exit code $EXIT_CODE. Aborting deployment to prevent application downtime."
            exit 1
          fi

          echo "Database migrations applied and verified successfully."

      - name: Download Active ECS Web Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_WEB_TASK_DEF}" \
            --query taskDefinition > task-definition.json

      - name: Render New Image in Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend-api
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Task Definition to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify Backend Health Probe via ALB
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${PROJECT_NAME}-${ENVIRONMENT}-alb" \
            --query "LoadBalancers[0].DNSName" --output text)

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" == "None" ]; then
            echo "::warning::Could not resolve ALB DNS name directly; skipping external HTTP health probe."
            exit 0
          fi

          echo "Probing backend health at http://${ALB_DNS}/health ..."
          SUCCESS=0
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_DNS}/health" || true)
            if [ "$HTTP_CODE" == "200" ]; then
              echo "Backend health check PASSED (HTTP 200) on attempt $i"
              SUCCESS=1
              break
            fi
            echo "Health probe returned HTTP $HTTP_CODE. Waiting 10s before retry (attempt $i/12)..."
            sleep 10
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Backend health check failed after ECS deployment!"
            exit 1
          fi

  # ============================================================================
  # 3. Frontend Static Assets Build & CloudFront Deployment
  # ============================================================================
  deploy-frontend:
    name: Build Frontend, Sync to S3 & Invalidate CloudFront
    needs: [quality-and-build, deploy-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Least-Privilege OIDC Authentication
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Frontend Application
        working-directory: frontend
        env:
          # Production API URL: Relative path defaults to same-origin /api/v1 via CloudFront ALB proxy
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api/v1' }}
        run: |
          npm ci
          npm run build

      - name: Resolve Target S3 Bucket & CloudFront Distribution
        id: resolve-resources
        run: |
          # 1. Resolve S3 Bucket
          BUCKET="${{ vars.FRONTEND_S3_BUCKET }}"
          if [ -z "$BUCKET" ]; then
            BUCKET=$(aws s3api list-buckets \
              --query "Buckets[?starts_with(Name, '${PROJECT_NAME}-${ENVIRONMENT}-frontend')].Name | [0]" \
              --output text)
          fi

          # 2. Resolve CloudFront Distribution ID
          DIST_ID="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$DIST_ID" ]; then
            DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Comment=='${PROJECT_NAME} ${ENVIRONMENT} Frontend SPA Distribution'].Id | [0]" \
              --output text)
          fi

          echo "Target S3 Bucket: $BUCKET"
          echo "Target CloudFront Distribution: $DIST_ID"

          if [ -z "$BUCKET" ] || [ "$BUCKET" == "None" ]; then
            echo "::error::Target frontend S3 bucket could not be resolved!"
            exit 1
          fi

          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "dist_id=$DIST_ID" >> $GITHUB_OUTPUT

      # Upload static assets: Immutable caching for hashed assets; no-cache for index.html
      - name: Deploy Static Assets to S3
        run: |
          TARGET_BUCKET="${{ steps.resolve-resources.outputs.bucket }}"
          echo "Deploying frontend assets to s3://${TARGET_BUCKET}..."

          # 1. Sync immutable hashed bundles and css (cache for 1 year)
          aws s3 sync frontend/dist "s3://${TARGET_BUCKET}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # 2. Upload index.html with no-cache so browsers always receive newest release instantly
          aws s3 cp frontend/dist/index.html "s3://${TARGET_BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront CDN Cache
        if: steps.resolve-resources.outputs.dist_id != 'None' && steps.resolve-resources.outputs.dist_id != ''
        run: |
          DIST_ID="${{ steps.resolve-resources.outputs.dist_id }}"
          echo "Creating CloudFront invalidation for distribution ${DIST_ID}..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${DIST_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" --output text)
          echo "Invalidation created: $INVALIDATION_ID"

      - name: Verify Frontend Deployment Probe
        if: steps.resolve-resources.outputs.dist_id != 'None' && steps.resolve-resources.outputs.dist_id != ''
        run: |
          DIST_ID="${{ steps.resolve-resources.outputs.dist_id }}"
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id "${DIST_ID}" \
            --query "Distribution.DomainName" --output text)

          echo "Verifying frontend deployment at https://${CF_DOMAIN} ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${CF_DOMAIN}" || true)
          echo "Frontend returned HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "Frontend deployment verified successfully (HTTP 200)."
          else
            echo "Note: Initial response returned HTTP $HTTP_STATUS (CloudFront edge propagation may take 1-2 minutes)."
          fi
