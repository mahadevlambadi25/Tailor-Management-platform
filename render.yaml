services:
  # ============================================================================
  # BACKEND: Render Web Service (Node.js + Express + Prisma)
  # ============================================================================
  - type: web
    name: tailor-management-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tailor-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: DEFAULT_TENANT_SLUG
        value: royal-bespoke
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./uploads
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: OTP_MAX_ATTEMPTS
        value: 3

  # ============================================================================
  # FRONTEND: Render Static Site (React + Vite + TailwindCSS)
  # ============================================================================
  - type: web
    name: tailor-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

# ============================================================================
# DATABASE: Render Managed PostgreSQL Database
# ============================================================================
databases:
  - name: tailor-management-db
    plan: free
    databaseName: tailor_db
    user: tailor_admin
    ipAllowList: [] # Allows internal connections from Render services (free internal bandwidth)
